[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp2-admin"
version = "7.1.0.dev1"
description = "Panel administracyjny SP2 ADMIN dla środowiska Samba AD"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mariusz Klejno"}]
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-Login>=0.6.3,<1.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "Flask-WTF>=1.2,<2.0",
  "python-dotenv>=1.0,<2.0",
  "gunicorn>=22,<24",
  "ldap3>=2.9.1,<3.0",
  "pysnmp>=7.1,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "backup-*/",
  "backups/",
]
lint.ignore = [
  "I",
  "UP",
  "RUF",
  "LOG",
  "FURB",
  "SIM",
  "PIE794",
]
